name: CI

on:
    push:
        branches: [ main ]
        paths-ignore:
            - '**.md'
    pull_request:
        branches: [ main ]
        paths-ignore:
            - '**.md'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and verify (JDK ${{ matrix.java }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                java: [ '21', '25', '27' ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK ${{ matrix.java }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ matrix.java }}

            - name: Cache Maven local repository
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      maven-${{ runner.os }}-jdk${{ matrix.java }}-
                      maven-${{ runner.os }}-

            - name: Build
              run: ./mvnw -B -ntp install
