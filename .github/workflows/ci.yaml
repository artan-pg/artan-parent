name: CI

on:
  push:
    branches: [ main, '[0-9]+.[0-9]+.x' ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, '[0-9]+.[0-9]+.x' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25', '27' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-jdk${{ matrix.java }}-
            maven-${{ runner.os }}-

      - name: Validate Semantic Versioning format
        run: |
          VERSION=$(awk '/<artifactId>artan-parent<\/artifactId>/{found=1; next} found && /<version>/{gsub(/^[[:space:]]*<version>|<\/version>[[:space:]]*$/, ""); print; exit}' pom.xml)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::pom version '$VERSION' does not follow Semantic Versioning (MAJOR.MINOR.PATCH-SNAPSHOT)."
            exit 1
          fi
          echo "OK: '$VERSION' is a valid SemVer development version"

      - name: Build
        run: ./mvnw -B -ntp install
