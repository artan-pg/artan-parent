name: Deploy Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    group: deploy-release
    cancel-in-progress: false

jobs:
    build:
        name: Build and verify (JDK ${{ matrix.java }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                java: [ '21', '25', '27' ]
        steps:
            - name: Checkout (tag)
              uses: actions/checkout@v4

            - name: Set up JDK ${{ matrix.java }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ matrix.java }}

            - name: Cache Maven local repository
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      maven-${{ runner.os }}-jdk${{ matrix.java }}-
                      maven-${{ runner.os }}-

            - name: Build
              run: ./mvnw -B -ntp install

    deploy:
        name: Deploy release to Nexus (JDK 21)
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout (tag)
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Cache Maven local repository
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: maven-${{ runner.os }}-jdk21-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      maven-${{ runner.os }}-jdk21-
                      maven-${{ runner.os }}-

            - name: Read project version
              id: version
              run: |
                  VERSION=$(./mvnw -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)
                  echo "pom=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "pom.xml version: $VERSION"

            - name: Verify tag matches version
              env:
                  EXPECTED: ${{ steps.version.outputs.pom }}
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  if [ "$EXPECTED" != "$TAG" ]; then
                    echo "::error::Tag is v$TAG but pom.xml version is $EXPECTED. Refusing to deploy."
                    exit 1
                  fi
                  case "$EXPECTED" in
                    *-SNAPSHOT)
                      echo "::error::SNAPSHOT version ($EXPECTED) cannot be released. Remove -SNAPSHOT before tagging."
                      exit 1
                      ;;
                  esac
                  echo "OK: tag v$TAG matches version $EXPECTED"

            - name: Deploy to Nexus releases
              env:
                  NEXUS_MAVEN_USERNAME: ${{ secrets.NEXUS_MAVEN_USERNAME }}
                  NEXUS_MAVEN_PASSWORD: ${{ secrets.NEXUS_MAVEN_PASSWORD }}
              run: ./mvnw -B -ntp deploy
