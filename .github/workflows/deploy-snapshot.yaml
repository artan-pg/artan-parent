name: Deploy Snapshot

on:
    push:
        branches: [ main ]
        paths-ignore:
            - '**.md'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-snapshot
    cancel-in-progress: false

jobs:
    build:
        name: Build and verify (JDK ${{ matrix.java }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                java: [ '21', '25', '27' ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK ${{ matrix.java }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ matrix.java }}

            - name: Cache Maven local repository
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: maven-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      maven-${{ runner.os }}-jdk${{ matrix.java }}-
                      maven-${{ runner.os }}-

            - name: Build
              run: ./mvnw -B -ntp install

    deploy:
        name: Deploy to Nexus snapshots (JDK 21)
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Cache Maven local repository
              uses: actions/cache@v4
              with:
                  path: ~/.m2/artanpg/repository
                  key: maven-${{ runner.os }}-jdk21-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      maven-${{ runner.os }}-jdk21-
                      maven-${{ runner.os }}-

            - name: Verify version is a SNAPSHOT
              run: |
                  VERSION=$(./mvnw -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)
                  case "$VERSION" in
                    *-SNAPSHOT) echo "OK: deploying $VERSION" ;;
                    *) echo "::error::main must carry a -SNAPSHOT version (found: $VERSION). Releases go through the v* tag flow."
                       exit 1 ;;
                  esac

            - name: Deploy
              env:
                  NEXUS_MAVEN_USERNAME: ${{ secrets.NEXUS_MAVEN_USERNAME }}
                  NEXUS_MAVEN_PASSWORD: ${{ secrets.NEXUS_MAVEN_PASSWORD }}
              run: ./mvnw -B -ntp deploy
